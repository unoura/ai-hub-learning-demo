services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-hub-learning-demo
    restart: always
    env_file:
      # OPENAI_API_KEY / ANTHROPIC_API_KEY を注入(手順3で使用)。
      # 未作成でも起動できるよう required: false。`cp .env.example .env` で作成。
      - path: .env
        required: false
    environment:
      # コンテナ起動のたびに CPF マージを再適用
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
      # Durable %SYS: システムデータ(IRISSECURITY 含む)を永続ボリュームへ
      - ISC_DATA_DIRECTORY=/durable/iscdata
    ports:
      # ホスト側ポートは衝突しやすいので .env で上書き可能(既定値は非一般的な値)。
      - ${HOST_SUPERSERVER_PORT:-51972}:1972    # スーパーサーバ(SQL / xDBC / VS Code / iris session)
      - ${HOST_WEB_PORT:-51773}:52773           # 管理ポータル / Web アプリ
    volumes:
      - ./:/home/irisowner/dev
      # Durable %SYS の永続ボリューム(再作成・down/up でもデータ保持)
      - iris-durable:/durable
    # エントリーポイント: IRIS 起動を待って初回初期化(IRISSECURITY 暗号化)を実行し、
    # 前景では tini 経由で本来の /iris-main を exec する(docker/start.sh 参照)。
    entrypoint:
      - /bin/bash
      - /home/irisowner/dev/docker/start.sh

volumes:
  iris-durable:
